# Welcome to Custom rewards.
# Here you can add some special rewards if players hit a certain threshold of points.
# You can create custom rewards bby duplicating the "Example" reward underneath it and then change the parameters.
# More info and documentation can be found on the wiki: https://github.com/CraZyRc/Wiki

Rewards:
  Example:
    Threshold: 30 # amount of points to reach for this reward
    Animation: Spiral, RED / Butterfly, BLUE / CROWN, GOLD / DragonWings, GREEN / RITUAL, AQUA # display aniamtion when receiving the reward
    Games: # on what games is this reward achievable
      - Wam
      - WhackaMole
    RewardTypes:
      - Type: Item # type of reward, possible reward types: Item, Effect, Teleport, Currency, Message, Sound.
        Settings:
          Material: DIAMOND_AXE
          Amount: 1
          NBT: "[enchantments={levels:{looting:1}},unbreakable={},damage=31]"
      - Type: Effect
        Settings:
          Effect: GLOWING
          Duration: 15 # in ticks
          Amplifier: 1
      - Type: Teleport
        Settings:
          World: world
          X: 0
          Y: 60
          Z: 0
      - Type: Currency
        Settings:
          Quantity: 60
      - Type: Message
        Settings:
          messageType: Json # Json or String
          Message: '["",{"text":"! JACKPOT ! ","bold":true,"color":"gold"},{"text":"well played !"}]'
      - Type: Sound
        Settings:
          Sound: ENTITY_GENERIC_EXPLOD # A list of sounds can be found on: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
          Volume: 1.0F
          Pitch: 1.0F

  Jackpot:
    Threshold: 150
    Animation: CROWN, AQUA
    Games:
      - WAM
      - Spawn2
    RewardTypes:
      - Type: Currency
        Settings:
          Quantity: 1500
      - Type: Effect
        Settings:
          Effect: GLOWING
          Duration: 30
          Amplifier: 1
      - Type: Message
        Settings:
          messageType: String
          Message: "&6&b!!!! JACKPOT !!!!"