# Welcome to Custom rewards.
# Here you can add some special rewards if players hit a certain threshold of points.
# You can create custom rewards by duplicating the "Example" reward underneath it and then change the parameters.
# More info and documentation can be found on the wiki: https://github.com/CraZyRc/Wiki/V3-Custom-Rewards

Rewards:
  Example:
    Threshold: 30 # amount of points to reach for this reward
    Games: # on what games is this reward achievable
      - Wam
      - WhackaMole
    RewardTypes:
      - Type: Animation # type of reward, possible reward types: Animation, Item, Effect, Teleport, Currency, Message, Sound.
        Settings:
          DisplayAnimation: true # Whether you want the Reward to be given with the animation or instantaneously give the reward
          RewardChance: 100
          Animation: Dragon_wings # See the example Animations in the Animations folder
          Duration: 2 # in seconds
      - Type: Item
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Material: DIAMOND_AXE
          Amount: 1
          NBT: "[enchantments={levels:{looting:1}},unbreakable={},damage=31]"
      - Type: Effect
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Effect: GLOWING
          Duration: 15 # in ticks
          Amplifier: 1
      - Type: Teleport
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          World: world
          Rotation: NORTH
          X: 0.0
          Y: 60.0
          Z: 0.0
      - Type: Currency
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Quantity: 60
      - Type: Message
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          MessageType: Json # Json or String
          Message: '["",{"text":"! JACKPOT ! ","bold":true,"color":"gold"},{"text":"well played !"}]'
      - Type: Sound
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Sound: ENTITY_GENERIC_EXPLODE # A list of sounds can be found on: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
          Volume: 1.0F
          Pitch: 1.0F

  Jackpot:
    Threshold: 150
    Games:
      - WAM
      - Spawn2
    RewardTypes:
      - Type: Currency
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Quantity: 1500
      - Type: Effect
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          Effect: GLOWING
          Duration: 30
          Amplifier: 1
      - Type: Message
        Settings:
          DisplayAnimation: true
          RewardChance: 100
          MessageType: String
          Message: "&6&b!!!! JACKPOT !!!!"